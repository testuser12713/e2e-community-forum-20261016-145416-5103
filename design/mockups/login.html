<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden — Community</title>
<link rel="stylesheet" href="styles.css">
<script>
(function () {
  try {
    var t = localStorage.getItem("theme") || "system";
    var d = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
  } catch (e) {}
})();
</script>
</head>
<body>

<main class="auth-wrap" data-od-id="login-main">
  <div class="card auth-card auth-card--400" data-od-id="login-card">
    <div class="between">
      <a class="brand" href="index.html" data-od-id="brand">
        <span class="brand-mark" aria-hidden="true">C</span> Community
      </a>
      <button class="icon-btn" data-theme-toggle aria-label="Hell/Dunkel umschalten" data-od-id="theme-toggle">
        <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>

    <h1 data-od-id="login-title">Willkommen zurück</h1>
    <p class="muted" style="margin-top:4px">Melde dich an, um Threads zu schreiben und abzustimmen.</p>

    <!-- Error state example (hidden): wrong credentials -> shown above the form -->
    <div class="banner banner--danger" hidden data-od-id="login-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      Benutzername oder Passwort ist falsch.
    </div>

    <form class="stack gap-3" style="margin-top:24px" data-od-id="login-form">
      <div class="field">
        <label for="login-id">Benutzername oder E-Mail</label>
        <input class="input" id="login-id" name="identity" type="text" autocomplete="username" value="mara">
      </div>

      <div class="field">
        <label for="login-pw">Passwort</label>
        <div class="input-wrap">
          <input class="input" id="login-pw" name="password" type="password" autocomplete="current-password" value="geheim12345">
          <button class="icon-btn" type="button" aria-label="Passwort anzeigen" title="Passwort anzeigen"
                  onclick="var i=document.getElementById('login-pw'); i.type = i.type === 'password' ? 'text' : 'password';">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary btn-lg btn-block" type="submit">Anmelden</button>
      </div>
    </form>

    <p class="center small" style="text-align:center;margin-top:16px">
      Noch kein Konto? <a href="register.html">Registrieren</a>
    </p>

    <hr class="divider">
    <p class="helper" style="text-align:center">Angemeldet bleibst du über ein sicheres Refresh-Token-Cookie.</p>
  </div>
</main>

<div class="toast-region" aria-live="polite" data-od-id="toast-region"></div>
<script src="app.js"></script>
</body>
</html>
