<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden — Community</title>
<link rel="stylesheet" href="styles.css">
<script>
(function () {
  try {
    var t = localStorage.getItem("theme") || "system";
    var d = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="app-header" data-od-id="app-header">
  <div class="container">
    <a class="brand" href="index.html" data-od-id="brand"><span class="brand-mark" aria-hidden="true">C</span><span class="txt">Community</span></a>
    <form class="search-bar" role="search" action="search.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" name="q" placeholder="Threads durchsuchen…" aria-label="Threads durchsuchen">
    </form>
    <div class="header-actions">
      <button class="icon-btn" data-theme-toggle aria-label="Hell/Dunkel umschalten">
        <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="auth-wrap" data-od-id="notfound-main">
  <div style="max-width:520px;text-align:center">
    <p class="tabular" style="font-size:34px;font-weight:600;line-height:40px">404</p>
    <h2 style="margin-top:8px">Diese Seite existiert nicht (mehr).</h2>
    <p class="muted" style="margin-top:8px">Vielleicht wurde der Thread gelöscht, die Kategorie umbenannt oder der Link ist falsch.</p>
    <div class="row gap-2" style="justify-content:center;margin-top:24px">
      <a class="btn btn-primary" href="index.html" data-od-id="to-home">Zur Startseite</a>
      <a class="btn btn-secondary" href="search.html" data-od-id="to-search">Zur Suche</a>
    </div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
