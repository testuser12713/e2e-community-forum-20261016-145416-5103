[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared"
version = "0.1.0"
description = "Shared models, schemas and database session for the community forum API and worker"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "pydantic[email]>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "nh3>=0.2,<1",
    "markdown-it-py>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["shared", "shared.schemas"]
package-dir = { "shared" = "." }
